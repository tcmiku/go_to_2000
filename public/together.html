<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9e7e2"><title>一起听 · iPod｜千禧冲浪站</title><link rel="icon" href="/assets/favicons/vinyl.svg"><link rel="stylesheet" href="/together.css"><link rel="stylesheet" href="/together-chat.css?v=vote-buttons-2"><script type="module" src="/together.js?v=vote-buttons-2"></script></head>
<body><main class="desktop">
<section class="ipod" aria-label="一起听 iPod">
<div class="hold-switch" aria-hidden="true"></div>
<svg class="ipod-earphones" viewBox="0 0 170 390" aria-hidden="true"><defs><filter id="earphone-shadow" x="-30%" y="-20%" width="160%" height="140%"><feDropShadow dx="1.5" dy="2" stdDeviation="1.4" flood-color="#52605b" flood-opacity=".3"/></filter><linearGradient id="earphone-white"><stop stop-color="#c9cecb"/><stop offset=".35" stop-color="#ffffff"/><stop offset=".8" stop-color="#f4f6f3"/><stop offset="1" stop-color="#bdc5c0"/></linearGradient></defs><g filter="url(#earphone-shadow)"><path d="M205 30V18C205 2 126 4 115 19C97 45 120 104 109 144C98 184 34 184 25 223C11 279 91 302 102 261C114 216 52 204 38 251C29 282 52 315 67 327" fill="none" stroke="#c3cbc6" stroke-width="4"/><path d="M205 30V18C205 2 126 4 115 19C97 45 120 104 109 144C98 184 34 184 25 223C11 279 91 302 102 261C114 216 52 204 38 251C29 282 52 315 67 327" fill="none" stroke="#fcfdf9" stroke-width="2.6"/><path d="M67 327C80 340 104 324 108 304M67 327C62 350 33 350 28 330" fill="none" stroke="#f8faf5" stroke-width="2.6"/><rect x="201" y="22" width="8" height="15" rx="2.8" fill="url(#earphone-white)"/><rect x="64" y="320" width="6" height="13" rx="2.7" fill="url(#earphone-white)"/><g transform="translate(109 306) rotate(20)"><rect x="-4" y="-20" width="8" height="23" rx="3.5" fill="url(#earphone-white)"/><ellipse cx="0" cy="-27" rx="11" ry="14" fill="url(#earphone-white)"/><ellipse cx="2" cy="-28" rx="5.5" ry="9" fill="#9fa9a3"/><ellipse cx="2" cy="-28" rx="3.5" ry="7" fill="#65716b"/><path d="M0-34v12M3-34v12" stroke="#acb6af" stroke-width=".6"/></g><g transform="translate(28 330) rotate(-29)"><rect x="-4" y="-20" width="8" height="23" rx="3.5" fill="url(#earphone-white)"/><ellipse cx="0" cy="-27" rx="11" ry="14" fill="url(#earphone-white)"/><ellipse cx="-2" cy="-28" rx="5.5" ry="9" fill="#a2ada6"/><ellipse cx="-2" cy="-28" rx="3.5" ry="7" fill="#65716b"/><path d="M-3-34v12M0-34v12" stroke="#acb6af" stroke-width=".6"/></g></g></svg>
<div class="screen-bezel"><div class="screen" id="screen">
<header class="statusbar"><button id="screen-back" aria-label="返回上一页">‹ 返回</button><button id="screen-home" aria-label="主菜单">iPod</button><strong id="screen-title">房间大厅</strong><span id="play-indicator" aria-label="已暂停">Ⅱ</span><span class="battery" aria-hidden="true"><i></i></span></header>
<div class="screen-content">
<section data-screen="menu" class="menu-screen" hidden><nav class="main-menu" aria-label="主菜单">
<button data-view="lobby" class="menu-row">房间大厅<span>›</span></button><button data-view="music" class="menu-row">音乐<span>›</span></button><button data-view="now" class="menu-row">正在播放<span>›</span></button><button data-view="room" class="menu-row">我的房间<span>›</span></button><button data-view="settings" class="menu-row">设置<span>›</span></button><a href="/" class="menu-row">返回主页<span>›</span></a>
</nav><div class="menu-art" aria-hidden="true"><div class="album-art"><i></i></div><div class="album-reflection"></div></div></section>
<section data-screen="lobby"><div class="screen-toolbar"><button id="new-room">＋ 创建</button><button data-view="join">房间码</button><button id="refresh-rooms" aria-label="刷新房间">↻</button></div><div id="room-list" class="scroll-list" aria-label="在线房间" aria-live="polite" aria-busy="true"><div class="screen-empty">加载中…</div></div></section>
<section data-screen="join" hidden><form id="room-form" class="screen-form" data-action="join"><label for="nickname">昵称</label><input id="nickname" maxlength="20" placeholder="输入昵称" autocomplete="off" required pattern=".*\S.*" title="请输入昵称"><div id="room-code-field"><label for="room-code">房间码</label><input id="room-code" maxlength="8" placeholder="8 位房间码" autocomplete="off" spellcheck="false" required></div><button id="enter-room" type="submit" class="wide-button">加入房间</button></form></section>
<section data-screen="room" hidden><div id="room-info" hidden><div class="room-number"><span id="active-code"></span><span id="connection">未加入</span><i id="connection-led"></i></div><div class="room-now"><div class="room-now-heading"><button data-view="now" class="room-current" aria-label="查看正在播放"><b id="room-now-title">未在播放</b><small id="room-now-artist">—</small></button><button id="room-play" aria-label="播放" aria-pressed="false" disabled>▶</button></div><input id="room-seek" type="range" min="0" max="1000" value="0" aria-label="房间播放进度" disabled><span id="room-time">0:00 / 0:00</span></div><div class="room-music-nav"><button data-view="playlist" class="menu-row">房间歌单 <small id="playlist-count">0</small><span>›</span></button><button data-view="music" class="menu-row">点歌<span>›</span></button></div><div id="members" class="members" aria-label="房间成员"></div><div class="screen-toolbar"><button id="invite">复制邀请</button><button id="leave">离开房间</button></div><input id="invite-url" aria-label="邀请链接" readonly hidden></div><div id="no-room"><button data-view="lobby" class="menu-row">房间大厅<span>›</span></button><button data-view="join" class="menu-row">加入房间<span>›</span></button></div></section>
<section data-screen="playlist" hidden><div class="screen-toolbar"><button data-view="music">＋ 添加歌曲</button><button data-view="now">正在播放</button></div><div id="room-playlist" aria-label="房间共享歌单"><div class="screen-empty">歌单为空</div></div></section>
<section data-screen="music" hidden><form id="search-form" class="screen-toolbar"><input id="music-query" type="search" aria-label="搜索歌曲或歌手" placeholder="歌曲 / 歌手" maxlength="100"><button type="submit" aria-label="搜索">⌕</button></form><div class="music-tabs"><button id="library-tab" aria-pressed="true">曲库</button><button id="favorites-tab" aria-pressed="false">收藏</button></div><div id="music-list" class="scroll-list" aria-label="歌曲列表"></div><button id="load-more" class="wide-button" hidden>更多</button></section>
<section data-screen="now" hidden><div class="now-track"><div class="album-art" aria-hidden="true"><i></i></div><div><h1 id="shared-title">未在播放</h1><p id="shared-status">—</p><button id="favorite-track" aria-label="收藏歌曲" aria-pressed="false">＋ 收藏</button></div></div><input id="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度" disabled><div class="time-row"><span id="elapsed">0:00</span><span id="duration">0:00</span></div><div class="screen-toolbar playback-toolbar"><button id="now-play" aria-label="播放" aria-pressed="false" disabled>▶</button><button id="stop" aria-label="停止">■</button><button data-view="lyrics">歌词</button><button data-view="playlist">歌单</button><button id="enable-audio" hidden>打开声音</button></div></section>
<section data-screen="lyrics" hidden><div id="lyrics-empty" class="screen-empty">暂无歌词</div><div id="lyrics" class="lyrics" hidden><p data-lyric="previous"></p><strong data-lyric="current"></strong><small data-lyric="translation"></small><p data-lyric="next"></p></div></section>
<section data-screen="settings" hidden><div class="screen-form"><label for="volume">音量 <output id="volume-value">65%</output></label><input id="volume" type="range" min="0" max="100" value="65"><label for="source-select">音源</label><div class="input-row"><select id="source-select" aria-label="音乐源"><option value="">自动选择</option></select><button id="source-connect" aria-label="重新检测音源">↻</button></div><label for="quality-select">音质</label><select id="quality-select"><option value="128k">128 kbps</option><option value="320k">320 kbps</option><option value="flac">FLAC</option></select></div></section>
</div><p id="notice" class="notice" role="status" aria-live="polite" hidden></p><footer class="screen-footer"><span id="screen-count">一起听</span><span id="room-badge">未加入</span></footer>
</div></div>
<div class="click-wheel" id="click-wheel" role="group" aria-label="iPod 滚轮">
<button id="wheel-menu" class="wheel-button wheel-menu" aria-label="返回菜单">MENU</button><button id="previous-track" class="wheel-button wheel-previous" aria-label="上一首或上一项"><svg viewBox="0 0 28 20" aria-hidden="true"><path d="M3 3h3v14H3zM16 3v14L6 10zM26 3v14L16 10z"/></svg></button><button id="next-track" class="wheel-button wheel-next" aria-label="下一首或下一项"><svg viewBox="0 0 28 20" aria-hidden="true"><path d="M22 3h3v14h-3zM2 3l10 7-10 7zM12 3l10 7-10 7z"/></svg></button><button id="play-toggle" class="wheel-button wheel-play" aria-label="播放或暂停" aria-pressed="false"><svg viewBox="0 0 28 20" aria-hidden="true"><path d="M4 3l11 7-11 7zM18 3h3v14h-3zM24 3h3v14h-3z"/></svg></button><button id="wheel-select" class="wheel-select" aria-label="确认选择"></button>
</div></section><section class="retro-computer" id="retro-computer" aria-label="MacBook Air 房间聊天电脑">
  <div class="air-lid">
    <div class="air-camera" aria-hidden="true"></div>
    <div class="air-bezel"><div class="air-glass"><div class="computer-display" id="computer-display">
      <div class="computer-desktop"><button class="qq-shortcut" id="qq-shortcut" aria-label="打开 QQ 聊天室"><span class="penguin" aria-hidden="true"><i></i></span><span>QQ 聊天室</span></button></div>
      <section class="qq-window" id="qq-window" aria-label="QQ 房间聊天室">
        <header class="qq-titlebar"><span class="penguin small" aria-hidden="true"><i></i></span><strong id="qq-room-title">一起听 · 聊天室</strong><div class="qq-window-controls"><button id="qq-minimize" aria-label="最小化聊天窗口">_</button><button id="qq-maximize" aria-label="最大化聊天窗口" aria-pressed="false">□</button><button id="qq-close" aria-label="关闭聊天窗口">×</button></div></header>
        <div class="qq-menu"><span>QQ 2000</span><span class="qq-online"><i id="qq-status-led"></i><span id="qq-identity">离线</span></span></div>
        <div class="qq-conversation-header"><span class="qq-room-icon" aria-hidden="true"><i></i><i></i><i></i></span><div><strong>一起听 · 群聊</strong><span id="qq-song">—</span></div><span class="qq-version" aria-hidden="true">QQ</span></div>
        <div class="qq-body"><div class="qq-main">
          <div class="qq-history"><div id="qq-messages" class="qq-messages" role="log" aria-label="房间聊天消息" aria-live="polite" aria-relevant="additions" tabindex="0"></div><button id="qq-unread" class="qq-unread" hidden></button></div>
          <form id="qq-form" class="qq-form"><div class="qq-tools"><button type="button" id="qq-emote-toggle" aria-expanded="false" aria-controls="qq-emotes"><span aria-hidden="true">:)</span> 表情</button><button type="button" id="qq-font" aria-pressed="false"><b aria-hidden="true">A</b> 字号</button><button type="button" id="qq-latest">↓ 最新</button></div>
            <div id="qq-emotes" class="qq-emotes" hidden><button type="button" data-emote=":)">:)</button><button type="button" data-emote=":D">:D</button><button type="button" data-emote="^_^">^_^</button><button type="button" data-emote="T_T">T_T</button><button type="button" data-emote=";)">;)</button><button type="button" data-emote="(握手)">(握手)</button></div>
            <textarea id="qq-input" maxlength="1000" rows="3" aria-label="聊天消息" placeholder="输入消息…" disabled></textarea>
            <div class="qq-compose-status"><span id="qq-error" role="status" aria-live="polite"></span><span id="qq-counter">0/1000</span></div>
            <div class="qq-actions"><span id="qq-status">未加入房间</span><button type="button" id="qq-close-bottom">关闭(C)</button><button type="submit" id="qq-send" disabled>发送(S)</button></div>
          </form>
        </div><aside class="qq-contacts"><div class="qq-contacts-heading">在线听友 <span id="qq-member-count">0</span></div><ul id="qq-contact-list"></ul><div class="qq-contact-footer" aria-hidden="true"><span class="penguin"><i></i></span><span>OICQ · 2000</span></div></aside></div>
      </section>
      <div class="computer-taskbar"><span class="computer-start" aria-hidden="true"><i></i>开始</span><button id="qq-task" aria-pressed="true">QQ · 一起听</button><time id="computer-clock"></time></div>
    </div></div></div>
    <div class="air-chin" aria-hidden="true">MacBook Air</div>
  </div>
  <div class="air-hinge" aria-hidden="true"><i></i><i></i></div>
  <div class="air-deck">
    <span class="air-speaker air-speaker-left" aria-hidden="true"></span><span class="air-speaker air-speaker-right" aria-hidden="true"></span>
    <button id="monitor-power" class="air-power" aria-label="MacBook 屏幕电源" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M7 6a8 8 0 1 0 10 0"/></svg></button>
  <div class="air-keyboard" aria-label="MacBook 键盘"><div class="keyboard-row" aria-hidden="true"><span>Esc</span><span>F1</span><span>F2</span><span>F3</span><span>F4</span><span>F5</span><span>F6</span><span>F7</span><span>F8</span><span>F9</span><span>F10</span><span>F11</span><span>F12</span></div><div class="keyboard-row" aria-hidden="true"><span>~</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span><span>−</span><span>⌫</span></div><div class="keyboard-row" aria-hidden="true"><span>Tab</span><span>Q</span><span>W</span><span>E</span><span>R</span><span>T</span><span>Y</span><span>U</span><span>I</span><span>O</span><span>P</span><span>[</span><span>]</span></div><div class="keyboard-row"><span aria-hidden="true">Caps</span><span aria-hidden="true">A</span><span aria-hidden="true">S</span><span aria-hidden="true">D</span><span aria-hidden="true">F</span><span aria-hidden="true">G</span><span aria-hidden="true">H</span><span aria-hidden="true">J</span><span aria-hidden="true">K</span><span aria-hidden="true">L</span><button id="keyboard-send" aria-label="按回车键发送消息" disabled>return ↵</button></div><div class="keyboard-row" aria-hidden="true"><span>fn</span><span>⌥</span><span>⌘</span><span class="space-key"></span><span>⌘</span><span>⌥</span><span>←</span><span>↑</span><span>↓</span><span>→</span></div></div>
    <button id="air-trackpad" class="air-trackpad" aria-label="触控板：打开聊天输入"></button>
    <div class="air-front-edge" aria-hidden="true"><i></i></div>
  </div>
</section>
</main><audio id="audio" preload="metadata"></audio></body></html>
