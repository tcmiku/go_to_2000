<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#152e2c"><title>街角报刊亭</title>
<link rel="icon" href="/assets/favicons/surfer.svg" type="image/svg+xml">
<link rel="stylesheet" href="/newsstand.css"><script type="module" src="/newsstand.js"></script>
</head>
<body>
<header class="street-header"><a class="home-link" href="/" aria-label="返回千禧冲浪站">←</a><span class="street-name">街角 · 报刊亭</span><time id="today"></time><button id="light-switch" class="icon-button" aria-label="切换灯光" aria-pressed="true">☀</button></header>
<main><section class="newsstand" aria-label="报刊亭">
<div class="shop-sign"><h1>街角报刊亭</h1><span class="open-tag">营业中</span></div>
<div class="rack-area"><div id="racks" class="racks" aria-label="我的书架"></div><div id="empty" class="empty-slip" role="status" hidden>书架还空着<small>把想读的书，放在这里</small><button id="empty-add">＋ 找书上架</button></div></div>
<div class="counter"><nav class="category-tabs" aria-label="书架分类"><button data-category="all" aria-pressed="true">我的书架</button><button data-category="literature" aria-pressed="false">文学</button><button data-category="novel" aria-pressed="false">小说</button><button id="find-books">＋ 找书</button></nav><div class="counter-bottom"><form id="source-search" role="search"><input id="source-query" type="search" placeholder="查找架上的书" aria-label="查找书架" autocomplete="off"><button aria-label="搜索书架" class="search-button">⌕</button></form><div class="pager"><button id="previous" aria-label="上一架">‹</button><output id="page-number" aria-live="polite">01 / 01</output><button id="next" aria-label="下一架">›</button></div></div></div>
</section></main>
<footer class="street-footer"><span>只收下你想读的书</span><a href="https://github.com/aoaostar/legado" target="_blank" rel="noopener noreferrer">LEGADO ↗</a></footer>
<dialog id="finder" aria-labelledby="finder-title"><button class="close-paper" data-close="finder" aria-label="关闭找书">×</button><section class="finder-paper">
<span class="paper-category">街角选书处</span><h2 id="finder-title">找一本，慢慢读</h2>
<form id="book-search"><label for="book-query" class="sr-only">书名或作者</label><input id="book-query" placeholder="输入书名 / 作者，自动匹配全部书源" autocomplete="off" maxlength="120" required><button type="submit" id="search-books">全源搜书</button></form>
<p id="source-summary" class="source-summary">正在载入全量书源…</p><div class="search-progress"><progress id="search-progress" max="1" value="0" aria-label="书源搜索进度" hidden></progress><button id="stop-search" hidden>停止搜索</button></div>
<details class="source-tools"><summary>单独浏览书源 / 通过网址加书</summary><label for="source-select">选择书源</label><select id="source-select"><option>正在读取书源…</option></select><div class="finder-tools"><button id="explore-books">逛逛书源</button><select id="explore-channel" aria-label="发现栏目" hidden></select><a id="download-source" download>↓ 当前书源</a></div><form id="url-form"><label for="book-url" class="sr-only">所选书源的书籍详情网址</label><input id="book-url" type="url" required placeholder="粘贴所选书源的书籍详情网址"><button>解析书籍</button></form></details>
<p id="find-status" class="inline-status" role="status">输入书名或作者，自动从全部文字书源找书。</p><details id="search-errors" hidden><summary id="error-summary">未完成的书源</summary><ul id="source-failures"></ul></details><div id="search-results" class="search-results"></div><button id="show-matches" hidden>显示更多已找到的书</button><button id="more-results" hidden>继续搜索下一页</button>
</section></dialog>
<dialog id="publication" aria-labelledby="publication-title"><button class="close-paper" data-close="publication" aria-label="放回书刊">×</button><div class="paper-spread"><div id="detail-cover" class="detail-cover"></div><section class="paper-page"><span id="detail-category" class="paper-category"></span><h2 id="publication-title"></h2><span id="source-name" class="source-name"></span><p id="book-intro"></p><div class="paper-actions"><button id="read-book" class="read-link">开始阅读</button><button id="save-book">＋ 放上书架</button></div><p id="toc-status" role="status"></p><ol id="chapters" class="chapter-list"></ol><button id="more-chapters" hidden>继续加载目录</button></section></div></dialog>
<dialog id="reader" aria-labelledby="chapter-title"><section class="reader-paper"><header class="reader-toolbar"><button id="reader-back">← 目录</button><span id="reading-book"></span><button id="font-smaller" aria-label="缩小字号">A−</button><button id="font-larger" aria-label="放大字号">A＋</button><button data-close="reader" aria-label="关闭阅读">×</button></header><article id="reading-page"><h2 id="chapter-title"></h2><p id="read-status" role="status"></p><div id="chapter-content"></div></article><nav class="reader-pagination" aria-label="章节切换"><button id="chapter-prev">上一章</button><span id="chapter-position"></span><button id="chapter-next">下一章</button></nav></section></dialog>
<div id="notice" class="notice" role="status" hidden></div>
</body></html>
