<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ded8cc"><title>随身听 · 磁带室</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='3' y='12' width='58' height='40' rx='6' fill='%2308628d'/%3E%3Crect x='8' y='17' width='48' height='24' rx='3' fill='%2383b7b0'/%3E%3Cg fill='%232b3d3b'%3E%3Ccircle cx='20' cy='31' r='8'/%3E%3Ccircle cx='44' cy='31' r='8'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="/cassette-room.css"><script type="module" src="/cassette-room.js"></script>
</head>
<body>
  <a class="back-link" href="/" aria-label="返回首页" title="返回首页">←</a>
  <main class="tabletop" aria-label="磁带播放器与磁带架">
    <div class="desk-grain" aria-hidden="true"></div>
    <div class="scene">
      <div class="headphone-cable" aria-hidden="true"><svg viewBox="0 0 700 400"><path d="M310 30 C285 100 480 45 435 170 S130 115 150 220 S375 370 490 310 S660 295 640 370"/></svg><i class="jack"></i></div>
      <section class="walkman-wrap" aria-label="随身听">
        <div class="wrist-strap" aria-hidden="true"></div>
        <div class="walkman" id="walkman">
          <div class="case-side" aria-hidden="true"><span></span><span></span><span></span><i></i></div>
          <div class="deck-top">
            <div class="brand"><b>SURFER</b><span>STEREO CASSETTE PLAYER</span></div>
            <div class="power"><i id="power-led"></i><span>ON</span></div>
            <span class="model">TPS–26</span>
          </div>
          <div class="deck-face">
            <i class="screw screw-tl" aria-hidden="true"></i><i class="screw screw-tr" aria-hidden="true"></i>
            <div class="bay" id="bay">
              <div class="bay-inner" aria-hidden="true"><i class="spindle left"></i><i class="spindle right"></i><span class="tape-head"></span><span class="bay-mark">A &nbsp; →</span></div>
              <div class="loaded-tape" id="loaded-tape"></div>
              <button class="glass-door" id="door" aria-label="打开磁带舱" aria-expanded="false"><span class="glass-sheen"></span><span class="door-print">AUTO STOP <i>STEREO</i></span><span class="latch"></span></button>
            </div>
            <div class="face-footer"><b>WALKMAN</b><span>HIGH FIDELITY</span><span class="metal-badge">II</span></div>
            <i class="screw screw-bl" aria-hidden="true"></i><i class="screw screw-br" aria-hidden="true"></i>
          </div>
          <div class="console-strip">
            <div class="counter-wrap"><span>TAPE COUNTER</span><output id="counter">000</output></div>
            <div class="readout"><div><i id="play-state">STOP</i><span id="current-time">00:00</span><span>/</span><span id="duration">--:--</span></div><input id="seek" type="range" min="0" max="100" value="0" step="1" aria-label="播放进度" disabled></div>
            <div class="volume-control"><span>VOLUME</span><label class="volume-knob" id="volume-knob"><span class="knob-cap" aria-hidden="true"></span><input type="range" id="volume" min="0" max="100" value="70" aria-label="音量"></label><span class="volume-scale">0 · · · 10</span></div>
          </div>
          <div class="transport">
            <button id="previous" aria-label="上一期" title="上一期"><span>▮◀</span><small>PREV</small></button>
            <button id="rewind" aria-label="后退15秒" title="后退 15 秒"><span>◀◀</span><small>REW</small></button>
            <button class="play-key" id="play" aria-label="播放" title="播放 / 暂停"><span id="play-icon">▶</span><small>PLAY</small></button>
            <button id="forward" aria-label="快进15秒" title="快进 15 秒"><span>▶▶</span><small>FF</small></button>
            <button id="next" aria-label="下一期" title="下一期"><span>▶▮</span><small>NEXT</small></button>
            <button id="stop" aria-label="停止" title="停止"><span>■</span><small>STOP</small></button>
            <button class="eject-key" id="eject" aria-label="退出磁带" title="退带"><span>⏏</span><small>EJECT</small></button>
          </div>
          <div class="bottom-edge" aria-hidden="true"><span>DC 3V</span><i></i><span>STEREO</span></div>
        </div>
      </section>
      <aside class="collection" aria-label="磁带收藏">
        <div class="rack" id="rack"><div class="rack-top" aria-hidden="true"></div><div class="rack-slots" id="rack-slots"></div><div class="rack-lip"><span>CASSETTES</span><small id="collection-count">01 / 08</small></div></div>
        <button class="add-tape" id="add-tape" aria-label="搜索并添加播客" title="搜索播客"><span>＋</span><i></i></button>
      </aside>
      <section class="track-paper" aria-label="单集目录">
        <span class="paper-clip" aria-hidden="true"></span>
        <header><span class="side-label">SIDE A</span><h1 id="paper-title">无聊斋</h1><button id="speed" aria-label="播放速度 1 倍" title="切换播放速度">1×</button></header>
        <div class="paper-tools"><label><span aria-hidden="true">⌕</span><input id="episode-filter" type="search" aria-label="查找单集" placeholder="查找单集" autocomplete="off"></label><span id="episode-count">—</span></div>
        <div class="episode-list" id="episode-list" aria-label="选择单集" aria-busy="true"><div class="paper-loading"><i></i><i></i><i></i></div></div>
        <footer><span id="paper-status" role="status" aria-live="polite"></span><button id="archive" title="读取往期节目">往期 ↓</button></footer>
      </section>
      <div class="pencil" aria-hidden="true"><span></span><i></i></div>
    </div>
  </main>
  <dialog id="search-dialog" class="search-drawer">
    <form id="search-form"><label class="sr-only" for="podcast-query">播客名称或小宇宙链接</label><input id="podcast-query" type="search" placeholder="播客名称 / 小宇宙链接" autocomplete="off" maxlength="300" required><button class="search-submit" aria-label="搜索">⌕</button><button type="button" class="close-search" id="close-search" aria-label="关闭搜索">×</button></form>
    <div id="search-status" class="search-status" role="status" aria-live="polite"></div><div id="search-results" class="search-results"></div>
  </dialog>
  <audio id="audio" preload="metadata"></audio>
</body>
</html>
