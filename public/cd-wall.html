<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e6e3da"><title>CD 收藏室 · 千禧冲浪站</title><link rel="icon" type="image/svg+xml" href="/assets/favicons/cd.svg"><link rel="stylesheet" href="/cd-wall.css"><link rel="stylesheet" href="/cd-case.css"><script type="module" src="/cd-wall.js"></script></head>
<body>
<main>
<section class="collection" aria-label="网站 CD 收藏架">
<div class="wood-crown"><a class="brass-button home-link" href="/" aria-label="返回冲浪站" title="返回冲浪站">↶</a><nav id="category-tabs" class="paper-tabs" aria-label="唱片分类"></nav><details class="shelf-search"><summary class="brass-button" aria-label="搜索唱片" title="搜索唱片"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg></summary><label><span class="sr-only">搜索唱片</span><input id="cd-search" type="search" placeholder="搜索" autocomplete="off"></label></details></div>
<nav id="subcategory-tabs" class="paper-tabs subcategory-tabs" aria-label="子分类" hidden></nav>
<div class="cabinet" id="cabinet" aria-busy="true"><div class="shelf loading-shelf"><div class="loading-spines" aria-hidden="true"></div><span class="shelf-label">正在整理收藏</span></div><div class="shelf loading-shelf"><div class="loading-spines" aria-hidden="true"></div></div><div class="shelf loading-shelf"><div class="loading-spines" aria-hidden="true"></div></div></div>
<div class="collection-bottom"><span id="collection-status" class="sr-only" role="status"></span><div class="page-controls"><button id="previous-page" disabled aria-label="上一页" title="上一页">←</button><span id="page-number">01 / 01</span><button id="next-page" disabled aria-label="下一页" title="下一页">→</button></div></div>
</section>
</main>
<dialog id="case-dialog" aria-labelledby="case-title"><button class="return-case" id="return-case" aria-label="放回架上" title="放回架上">×</button><div class="case-scene"><div class="open-case" id="open-case"><section class="booklet"><div class="booklet-top"><span id="booklet-number"></span></div><div class="booklet-art" aria-hidden="true"><span id="booklet-initial"></span><i></i></div><p class="booklet-category" id="booklet-category"></p><h2 id="case-title"></h2><div class="booklet-description" id="booklet-description"></div><div class="booklet-foot"><span id="booklet-domain"></span></div></section><div class="disc-tray"><div class="tray-rings" aria-hidden="true"></div><a id="disc-link" class="compact-disc" target="_blank" rel="noopener noreferrer" aria-label="访问网站"><span class="disc-name" id="disc-name"></span><span class="disc-hole" aria-hidden="true"></span><span class="disc-action" aria-hidden="true">↗</span></a><div class="tray-corner corner-a"></div><div class="tray-corner corner-b"></div></div><div class="case-lid" aria-hidden="true"><div class="cover"><span class="cover-art"></span><strong id="cover-title"></strong></div></div></div></div></dialog>
</body></html>
